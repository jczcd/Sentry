name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Python test dependencies
        run: python3 -m pip install --disable-pip-version-check pyyaml numpy

      - name: Validate repository
        run: ./tools/validate_repo.sh
